name: Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply EF Migrations
    runs-on: windows-latest
    
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Backend global.json (Unpin workloads)
        shell: pwsh
        run: Copy-Item global-backend.json global.json -Force

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Apply Migrations
        run: |
          dotnet ef database update --project src/TheButton.Infrastructure --startup-project src/TheButton.Api --connection "${{ secrets.THEBUTTON_AZURESQL_CONNECTIONSTRING }}"
