name: Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply EF Migrations
    runs-on: windows-latest
    
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Aligned with project's net10.0

      - name: Restore tools
        run: dotnet tool restore

      - name: Apply Migrations
        run: |
          dotnet ef database update --project src/TheButton.Infrastructure --startup-project src/TheButton.Api --connection "${{ secrets.THEBUTTON_AZURESQL_CONNECTIONSTRING }}"
