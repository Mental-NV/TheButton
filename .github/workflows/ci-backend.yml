name: CI Backend

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "src/mobile/**"
      - "tests/mobile/**"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/e2e-mobile.yml"
      - ".maestro/**"
      - "scripts/run-*-e2e.sh"
      - "**/*.md"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "src/mobile/**"
      - "tests/mobile/**"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/e2e-mobile.yml"
      - ".maestro/**"
      - "scripts/run-*-e2e.sh"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_MULTILEVEL_LOOKUP: 0
  NUGET_PACKAGES: ${{ github.workspace }}/nuget-packages

jobs:
  backend:
    name: Backend build & test
    runs-on: windows-latest
    env:
      DOTNET_ROOT: "" # Silences the linter

    steps:
      - uses: actions/checkout@v4

      - name: Use Backend global.json (Unpin workloads)
        shell: pwsh
        run: Copy-Item global-backend.json global.json -Force

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-backend-${{ hashFiles('global.json', 'src/TheButton.*/**/*.csproj', 'tests/TheButton.*/**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-backend-



      # Skip workload restore for backend only

      - name: Restore (Backend Solution)
        shell: pwsh
        run: |
          dotnet restore TheButton.Backend.sln

      - name: Build Backend
        run: dotnet build TheButton.Backend.sln -c Release --no-restore

      - name: Test Api Unit
        run: dotnet test tests/TheButton.Api.UnitTests/TheButton.Api.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results-unit.trx"

      - name: Test Api Integration
        run: dotnet test tests/TheButton.Api.IntegrationTests/TheButton.Api.IntegrationTests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results-integration.trx"

      - name: Test Infrastructure Integration
        run: dotnet test tests/TheButton.Infrastructure.IntegrationTests/TheButton.Infrastructure.IntegrationTests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results-infrastructure-integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: "**/*.trx"
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: src/TheButton.Web/package-lock.json

      - name: Install
        working-directory: src/TheButton.Web
        run: npm ci

      - name: Test
        working-directory: src/TheButton.Web
        run: npm test --if-present

      - name: Build
        working-directory: src/TheButton.Web
        run: npm run build --if-present

      - name: Upload web build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/TheButton.Web/dist
          if-no-files-found: ignore
          retention-days: 3
