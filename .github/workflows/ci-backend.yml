name: CI Backend

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "src/mobile/**"
      - "tests/mobile/**"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/e2e-mobile.yml"
      - ".github/badges/coverage.json"
      - ".maestro/**"
      - "scripts/run-*-e2e.sh"
      - "**/*.md"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "src/mobile/**"
      - "tests/mobile/**"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/e2e-mobile.yml"
      - ".github/badges/coverage.json"
      - ".maestro/**"
      - "scripts/run-*-e2e.sh"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_MULTILEVEL_LOOKUP: 0
  NUGET_PACKAGES: ${{ github.workspace }}/nuget-packages
  COVERAGE_THRESHOLD: 70

jobs:
  backend:
    name: Backend build & test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_ROOT: "" # Silences the linter

    steps:
      - uses: actions/checkout@v4

      - name: Use Backend global.json (Unpin workloads)
        shell: pwsh
        run: Copy-Item global-backend.json global.json -Force

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-backend-${{ hashFiles('global.json', 'src/TheButton.*/**/*.csproj', 'tests/TheButton.*/**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-backend-



      # Skip workload restore for backend only

      - name: Restore (Backend Solution)
        shell: pwsh
        run: |
          dotnet restore TheButton.Backend.sln

      - name: Restore local tools
        run: dotnet tool restore

      - name: Verify formatting
        run: dotnet format whitespace TheButton.Backend.sln --verify-no-changes --no-restore

      - name: Build Backend
        run: dotnet build TheButton.Backend.sln -c Release --no-restore

      - name: Test Api Unit
        run: dotnet test tests/TheButton.Api.UnitTests/TheButton.Api.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results-unit.trx" /p:CollectCoverage=true /p:CoverletOutput="${{ github.workspace }}/TestResults/coverage/coverage" /p:CoverletOutputFormat=json

      - name: Test Api Integration
        run: dotnet test tests/TheButton.Api.IntegrationTests/TheButton.Api.IntegrationTests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results-integration.trx" /p:CollectCoverage=true /p:CoverletOutput="${{ github.workspace }}/TestResults/coverage/coverage" /p:CoverletOutputFormat=json /p:MergeWith="${{ github.workspace }}/TestResults/coverage/coverage.json"

      - name: Test Infrastructure Integration
        run: dotnet test tests/TheButton.Infrastructure.IntegrationTests/TheButton.Infrastructure.IntegrationTests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results-infrastructure-integration.trx" /p:CollectCoverage=true /p:CoverletOutput="${{ github.workspace }}/TestResults/coverage/coverage" /p:CoverletOutputFormat=cobertura /p:MergeWith="${{ github.workspace }}/TestResults/coverage/coverage.json"

      - name: Assess merged coverage
        shell: pwsh
        run: |
          $coverageReport = "${{ github.workspace }}/TestResults/coverage/coverage.cobertura.xml"
          if (-not (Test-Path $coverageReport)) {
            throw "Coverage report not found at $coverageReport"
          }
          [xml]$coverageXml = Get-Content $coverageReport
          $lineRate = [double]$coverageXml.coverage.'line-rate'
          $linePercent = [math]::Round(($lineRate * 100), 2)
          $coverageThreshold = [double]"${{ env.COVERAGE_THRESHOLD }}"
          Write-Host "Merged line coverage: $linePercent%"
          if ($linePercent -lt $coverageThreshold) {
            throw "Merged line coverage $linePercent% is below the $coverageThreshold% threshold."
          }

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          $coverageReport = "${{ github.workspace }}/TestResults/coverage/coverage.cobertura.xml"
          if (-not (Test-Path $coverageReport)) {
            throw "Coverage report not found at $coverageReport"
          }
          [xml]$coverageXml = Get-Content $coverageReport
          $lineRate = [double]$coverageXml.coverage.'line-rate'
          $linePercent = [math]::Round(($lineRate * 100), 2)
          $color = if ($linePercent -ge 90) { "brightgreen" } elseif ($linePercent -ge 80) { "green" } elseif ($linePercent -ge 70) { "yellowgreen" } elseif ($linePercent -ge 60) { "yellow" } elseif ($linePercent -ge 50) { "orange" } else { "red" }
          $badge = @{
            schemaVersion = 1
            label = "coverage"
            message = "$linePercent`%"
            color = $color
          } | ConvertTo-Json -Compress
          $badgePath = "${{ github.workspace }}/.github/badges/coverage.json"
          New-Item -ItemType Directory -Force -Path (Split-Path $badgePath) | Out-Null
          $badge | Out-File -FilePath $badgePath -Encoding utf8

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if (-not $status) {
            Write-Host "No coverage badge changes to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git commit -m "docs: update coverage badge"
          git push

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: "**/*.trx"
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: src/TheButton.Web/package-lock.json

      - name: Install
        working-directory: src/TheButton.Web
        run: npm ci

      - name: Test
        working-directory: src/TheButton.Web
        run: npm test --if-present

      - name: Build
        working-directory: src/TheButton.Web
        run: npm run build --if-present

      - name: Upload web build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/TheButton.Web/dist
          if-no-files-found: ignore
          retention-days: 3
